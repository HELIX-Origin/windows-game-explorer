name: Stale

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close Stale Issues/PRs
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale and close
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            If this issue is still relevant, please comment to keep it open.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not
            had recent activity. It will be closed in 14 days if no further activity occurs.
          close-issue-message: 'Closed as stale. Reopen if still relevant.'
          close-pr-message: 'Closed as stale. Reopen if still relevant.'
          exempt-issue-labels: 'pinned,security,bug'
          exempt-pr-labels: 'pinned'
          operations-per-run: 100
