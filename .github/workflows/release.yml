name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.8.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build, Sign & Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $ver = "${{ github.event.inputs.version }}"
          }
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version $ver"

      - name: Build Release (/W4 /WX zero warnings)
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Package Distribution
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release

      - name: Install Windows SDK (signtool)
        shell: pwsh
        run: |
          $sdkUrl = "https://go.microsoft.com/fwlink/?linkid=2196241"
          Invoke-WebRequest -Uri $sdkUrl -OutFile "$env:TEMP\winsdk.exe"
          Start-Process -FilePath "$env:TEMP\winsdk.exe" -ArgumentList "/q", "/norestart" -Wait
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtoolDir = Get-ChildItem -Path $sdkPath -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Select-Object -First 1 | Select-Object -ExpandProperty DirectoryName
          if (-not $signtoolDir) {
            $signtoolDir = Get-ChildItem -Path $sdkPath -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 | Select-Object -ExpandProperty DirectoryName
          }
          if ($signtoolDir) { echo $signtoolDir >> $env:GITHUB_PATH }
          Write-Host "signtool found at: $signtoolDir"

      - name: Decode signing certificate from secrets
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERT_BASE64)) {
            Write-Host "No signing certificate configured, skipping."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:CERT_BASE64)
          [IO.File]::WriteAllBytes("signing-cert.pfx", $bytes)
          $certDir = "certs"
          if (-not (Test-Path $certDir)) { New-Item -ItemType Directory -Path $certDir -Force | Out-Null }
          $password = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
          $cert = Get-PfxCertificate -FilePath "signing-cert.pfx" -Password $password
          Export-Certificate -Cert $cert -FilePath "$certDir\game-explorer-dev.cer" -Force | Out-Null
          Write-Host "Certificate decoded."

      - name: Sign binaries
        shell: pwsh
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
          CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERT_THUMBPRINT)) {
            Write-Host "No signing thumbprint configured, skipping."
            exit 0
          }
          $password = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath "signing-cert.pfx" -CertStoreLocation "Cert:\CurrentUser\My" -Password $password | Out-Null
          $env:WINDOWS_CERT_THUMBPRINT = "${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}"
          ./scripts/sign.ps1 -Configuration Release

      - name: Prepare WDSI Submission Package
        shell: pwsh
        run: ./scripts/submit-to-wdsi.ps1 -Configuration Release
        continue-on-error: true

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $path = ".github/releases/v$ver.md"
          if (Test-Path $path) {
            $body = Get-Content $path -Raw
          } else {
            $body = "See CHANGELOG.md for details."
          }
          $body | Out-File -FilePath "release-notes.md" -Encoding utf8

      - name: Delete existing release (if any)
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $existing = gh release view "v$ver" --repo HELIX-Origin/windows-game-explorer 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Existing release found, deleting..."
            gh release delete "v$ver" --repo HELIX-Origin/windows-game-explorer --yes 2>$null
            Write-Host "Deleted existing release."
          } else {
            Write-Host "No existing release found, skipping."
          }
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Windows Game Explorer v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/*.zip
            dist/*.exe
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit to Winget (optional)
        shell: pwsh
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:PAT_TOKEN)) {
            Write-Host "PAT_TOKEN not set, skipping winget submission."
            exit 0
          }
          $wc = (Get-Command wingetcreate -ErrorAction SilentlyContinue)
          if (-not $wc) {
            Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe" -OutFile "wingetcreate.exe"
            $wc = ".\wingetcreate.exe"
          }
          # Check if a PR already exists for this version
          $existingPr = gh pr list --repo microsoft/winget-pkgs --search "HELIX-Origin.WindowsGameExplorer v${{ steps.version.outputs.version }}" --state open --json number --jq '.[0].number' 2>$null
          if ($existingPr) {
            Write-Host "Existing PR found: #$existingPr. Using it."
            $prNumber = $existingPr
          } else {
            $prUrl = & $wc submit --token $env:PAT_TOKEN --prtitle "New version: HELIX-Origin.WindowsGameExplorer v${{ steps.version.outputs.version }}" winget/manifests/h/HELIX-Origin/WindowsGameExplorer/${{ steps.version.outputs.version }}
            $prNumber = ($prUrl -split '/')[-1]
          }
          # Accept CLA only if bot asked and we haven't already
          $botComment = gh api "repos/microsoft/winget-pkgs/issues/$prNumber/comments" 2>$null | ConvertFrom-Json | Where-Object { $_.user.login -eq "microsoft-github-policy-service[bot]" -and $_.body -match "Contributor License Agreement" }
          $ourComments = gh api "repos/microsoft/winget-pkgs/issues/$prNumber/comments" 2>$null | ConvertFrom-Json | Where-Object { $_.user.login -eq "PhantomNimbi" -and $_.body -eq "I agree" }
          if ($botComment -and -not $ourComments) {
            $botCommentId = $botComment[0].id
            gh api "repos/microsoft/winget-pkgs/issues/$prNumber/comments" -f body="I agree" -f "in_reply_to=$botCommentId" 2>&1 | Out-Null
            Write-Host "CLA accepted (replied to bot comment)."
          } elseif ($ourComments) {
            Write-Host "CLA already accepted, skipping."
          } else {
            Write-Host "No CLA bot comment found, skipping."
          }
          Write-Host "Winget PR ready: #$prNumber"