name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.8.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign & Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $ver = "${{ github.event.inputs.version }}"
          }
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version $ver"

      - name: Build Release (/W4 /WX zero warnings)
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Run C++ Unit Tests
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release

      - name: Lint PowerShell Scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -Confirm:$false
          ./scripts/lint.ps1

      - name: Install Windows SDK (signtool)
        shell: pwsh
        run: |
          # Download and install Windows SDK for signtool
          $sdkUrl = "https://go.microsoft.com/fwlink/?linkid=2196241"
          Invoke-WebRequest -Uri $sdkUrl -OutFile "$env:TEMP\winsdk.exe"
          Start-Process -FilePath "$env:TEMP\winsdk.exe" -ArgumentList "/q", "/norestart" -Wait
          # Add signtool to PATH
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtoolDir = Get-ChildItem -Path $sdkPath -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 | Select-Object -ExpandProperty DirectoryName
          if ($signtoolDir) { echo $signtoolDir >> $env:GITHUB_PATH }
          Write-Host "signtool found at: $signtoolDir"

      - name: Decode signing certificate from secrets
        if: ${{ secrets.CODE_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:CERT_BASE64)
          [IO.File]::WriteAllBytes("signing-cert.pfx", $bytes)
          # Export public cert for distribution
          $certDir = "certs"
          if (-not (Test-Path $certDir)) { New-Item -ItemType Directory -Path $certDir -Force | Out-Null }
          $password = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
          $cert = Get-PfxCertificate -FilePath "signing-cert.pfx" -Password $password
          Export-Certificate -Cert $cert -FilePath "$certDir\game-explorer-dev.cer" -Force | Out-Null
          Write-Host "Certificate decoded and public cert exported."

      - name: Sign binaries
        if: ${{ secrets.CODE_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
          CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        run: |
          # Import PFX to cert store
          $password = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath "signing-cert.pfx" -CertStoreLocation "Cert:\CurrentUser\My" -Password $password | Out-Null
          # Sign using thumbprint
          $env:WINDOWS_CERT_THUMBPRINT = "${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}"
          ./scripts/sign.ps1 -Configuration Release
        continue-on-error: true

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Package Distribution
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release

      - name: Prepare WDSI Submission Package
        shell: pwsh
        run: ./scripts/submit-to-wdsi.ps1 -Configuration Release
        continue-on-error: true

      - name: Submit to Winget (optional)
        shell: pwsh
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:PAT_TOKEN)) {
            Write-Host "PAT_TOKEN not set, skipping winget submission."
            exit 0
          }
          # Install wingetcreate
          $wc = (Get-Command wingetcreate -ErrorAction SilentlyContinue)
          if (-not $wc) {
            Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe" -OutFile "wingetcreate.exe"
            $wc = ".\wingetcreate.exe"
          }
          # Submit manifest to microsoft/winget-pkgs
          & $wc submit --token $env:PAT_TOKEN --prtitle "New version: HELIX-Origin.WindowsGameExplorer v${{ steps.version.outputs.version }}" winget/manifests/h/HELIX-Origin/WindowsGameExplorer/${{ steps.version.outputs.version }}
          # Note: After PR creation, add a comment "/verify" to trigger the winget bot verification.
          Write-Host "Winget PR submitted. Add '/verify' comment to the PR to trigger verification."
        continue-on-error: true

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $path = ".github/releases/v$ver.md"
          if (Test-Path $path) {
            $body = Get-Content $path -Raw
          } else {
            $body = "See CHANGELOG.md for details."
          }
          # Write to file for action-gh-release
          $body | Out-File -FilePath "release-notes.md" -Encoding utf8
          Write-Output "notes_file=release-notes.md" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Windows Game Explorer v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/*.zip
            dist/*.exe
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}