name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Selected release tag to build and attach assets to (e.g. v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Build Release (/W4 /WX zero warnings)
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Run C++ Unit Tests
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release

      - name: Package Release Archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event.inputs.tag }}" -ne "") {
            $tag = "${{ github.event.inputs.tag }}"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build/Release/GameExplorerShell.dll" -Destination dist/ -ErrorAction Stop
          Copy-Item "build/Release/GameExplorerStudio.exe" -Destination dist/ -ErrorAction Stop
          Compress-Archive -Path "dist/*" -DestinationPath "windows-game-explorer-$tag-win64.zip" -Force
          echo "ARCHIVE=windows-game-explorer-$tag-win64.zip" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Windows Game Explorer ${{ env.RELEASE_TAG }}
          files: ${{ env.ARCHIVE }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
