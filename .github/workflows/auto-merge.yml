name: Auto Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'PhantomNimbi' || github.actor == 'github-actions[bot]'
    steps:
      - name: Enable auto-merge (squash) when checks pass
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch --repo ${{ github.repository }} || true