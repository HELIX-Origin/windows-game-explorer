name: Publish to WinGet

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.8.0)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-slim
    steps:
      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: HELIX-Origin.WindowsGameExplorer
          release-tag: ${{ github.event.release.tag_name || inputs.version }}
          token: ${{ secrets.PAT_TOKEN }}
          max-versions-to-keep: 5
