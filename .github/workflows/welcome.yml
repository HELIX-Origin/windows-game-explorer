name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome First-Time Contributor
    runs-on: ubuntu-latest
    steps:
      - name: Greet first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue in Windows Game Explorer! 🎉
            A maintainer will triage it shortly. Please include reproduction steps
            and your Windows version if applicable.
          pr-message: >
            Thanks for your first pull request! 🎉 Please ensure the quality gate
            passes (`game-explorer.bat build/test/lint`) and CHANGELOG.md is updated.
