name: CI

on:
  push:
    branches: [main, 'v2.0*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native C++20 Build & Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Release (/W4 /WX zero warnings)
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Run C++ Unit Tests
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release

      - name: Lint PowerShell Scripts (zero diagnostics)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -Confirm:$false
          ./scripts/lint.ps1

      - name: Install NSIS
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Package Distribution (portable ZIP + NSIS installer)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release
        continue-on-error: true