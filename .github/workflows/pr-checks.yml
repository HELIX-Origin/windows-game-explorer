name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            chore
            security
            build
            ci
          requireScope: false

  changelog:
    name: CHANGELOG Updated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md updated for code changes
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
            exit 0
          fi
          # Documentation / CI / workflow-only changes do not require a CHANGELOG entry.
          if echo "$changed" | grep -qvE '^(docs/|\.github/|.*\.md$)'; then
            echo "::error::Code changes detected but CHANGELOG.md was not updated."
            exit 1
          fi
          echo "No code changes; CHANGELOG not required."

  forbidden-patterns:
    name: Forbidden Patterns Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for forbidden external-scraper references
        run: |
          set -euo pipefail
          if grep -RInE 'igdb|steamgriddb|vndb|rawg' --include='*.cpp' --include='*.h' --include='*.hpp' --include='*.ps1' . ; then
            echo "::error::Forbidden external-scraper reference found (storefront-first discovery invariant)."
            exit 1
          fi
          echo "Forbidden-pattern scan passed."

  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
