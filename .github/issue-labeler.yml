# Issue auto-labeler configuration (github/issue-labeler)
# Maps labels to keyword lists matched against issue title/body.

bug:
  - 'bug'
  - 'crash'
  - 'error'
  - 'broken'
  - 'fails'
  - 'regression'

enhancement:
  - 'feature'
  - 'request'
  - 'add'
  - 'support'
  - 'implement'

documentation:
  - 'docs'
  - 'documentation'
  - 'readme'
  - 'typo'

question:
  - 'question'
  - 'how'
  - 'help'
  - 'usage'

security:
  - 'security'
  - 'vulnerability'
  - 'cve'
  - 'exploit'

performance:
  - 'performance'
  - 'slow'
  - 'lag'
  - 'optimize'

build:
  - 'build'
  - 'compile'
  - 'cmake'
  - 'msvc'
