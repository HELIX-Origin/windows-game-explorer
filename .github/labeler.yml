# PR auto-labeler configuration (actions/labeler v5)
# Labels are applied based on changed file paths.

'area: shell-extension':
- changed-files:
  - any-glob-to-any-file:
    - 'src/shell/**'
    - 'include/**'

'area: studio':
- changed-files:
  - any-glob-to-any-file:
    - 'src/manager/**'
    - 'src/studio/**'
    - 'src/config/**'
    - 'src/ui/**'

'area: build':
- changed-files:
  - any-glob-to-any-file:
    - 'CMakeLists.txt'
    - 'scripts/**'
    - 'installer/**'
    - 'third_party/**'

'area: docs':
- changed-files:
  - any-glob-to-any-file:
    - 'docs/**'
    - '**/*.md'

'area: ci':
- changed-files:
  - any-glob-to-any-file:
    - '.github/**'

'area: tests':
- changed-files:
  - any-glob-to-any-file:
    - 'tests/**'

'dependencies':
- changed-files:
  - any-glob-to-any-file:
    - 'third_party/**'
    - '**/package*.json'
    - '**/CMakeLists.txt'
